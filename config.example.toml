# Copy to config.toml (gitignored) and fill in your values.
# Quickest start: cp config.example.toml config.toml, then set token.

# Bearer token the Android app sends as `Authorization: Bearer <token>`.
# Must be at least 16 characters. Generate one with:
#   openssl rand -hex 32
token = "1111111111111111"

# Address the server listens on. The server speaks plain HTTP behind a
# reverse proxy that terminates TLS — same-host proxy is the default and
# recommended setup. 127.0.0.1:8080 means only the local proxy can reach
# the backend; nothing else on the network can.
#
# Other shapes (uncommon):
#   <lan-ip>:8080       proxy on a different host on the same LAN
#   <tailnet-ip>:8080   proxy on a different node in the same tailnet
#   0.0.0.0:8080        debug only — direct exposure with NO TLS
bind = "127.0.0.1:8080"

# Reverse proxies whose `X-Forwarded-For` header is trusted as the real
# client IP for auth-failure rate limiting and audit logs. XFF from any
# peer NOT in this list is ignored — it's just a request header any
# client can set, so trust must be gated by the TCP peer.
#
# Each entry is a plain IP (implicit /32 or /128) or a CIDR range. The
# default covers a same-host proxy. Examples:
#   "192.168.1.5"        single proxy on the same LAN
#   "100.64.0.0/10"      any peer in the Tailscale CGNAT range
#   "172.16.0.0/12"      any peer on a Docker bridge network
trusted_proxies = ["127.0.0.1", "::1"]

# ComfyUI HTTP endpoint (project-zun's `just serve` default).
comfy_url = "http://127.0.0.1:8188"

# Where jobs.db, inputs/, outputs/, and thumbs/ are stored.
data_dir = "./data"

# Directory holding ComfyUI workflow templates (`*.json`). Authored in the
# sibling project-zun repo; the server loads them at startup. If unset,
# defaults to `<data_dir>/workflows`. Set this when project-zun lives on
# a different host or path than this server's data_dir.
# workflows_dir = "/path/to/project-zun/workflows"

# Explicit workflows exposed to Android. Each must have a matching
# `<name>.json` in workflows_dir.
default_workflow = "flux2_klein_edit"
enabled_workflows = [
  "flux2_klein_edit",
]

# Log format: "auto" (pretty on TTY, JSON otherwise), "pretty", or "json".
log_format = "auto"

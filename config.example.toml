# zun-rust-server config.
#
# Setup:  cp config.example.toml config.toml
#         openssl rand -hex 32   # paste output as `token`
#         cargo run              # dev
#         zun-rust-server --config /etc/zun-rust-server/config.toml   # prod
#
# Two profiles below — DEV is active, PROD is commented. Swap the comment
# markers to switch.
#
# Relative paths (data_dir) resolve against THIS file's directory.

# --- DEV (phone on LAN, no proxy) -----------------------------------------
token = "REPLACE_ME_RUN_JUST_SETUP"
bind = "0.0.0.0:8080"
comfy_url = "http://127.0.0.1:8188"
data_dir = "./data"
log_format = "auto"

# --- PROD (behind same-host reverse proxy, Rocky/RHEL) --------------------
# token = "<openssl rand -hex 32>"
# bind = "127.0.0.1:8080"
# comfy_url = "http://127.0.0.1:8188"
# data_dir = "/var/lib/zun-rust-server"
# log_format = "json"


# === Reference ============================================================
#
# token
#   Secret your Android client sends as `Authorization: Bearer <token>`.
#   Required, at least 32 chars. Generate with: openssl rand -hex 32.
#   Without this, anyone hitting the port could control the server.
#
# bind
#   Where the server listens, as "<address>:<port>". Controls *who* can
#   connect at the network level, not just the port number.
#     0.0.0.0:8080        any network interface       (DEV — phone on LAN)
#     127.0.0.1:8080      same machine only           (PROD — behind a proxy)
#     192.168.1.10:8080   one specific LAN interface
#     100.64.0.5:8080     one specific tailnet interface
#
# comfy_url
#   HTTP base for ComfyUI (project-zun's `just serve` default is :8188).
#   Same value dev and prod when ComfyUI runs on the same machine.
#
# data_dir
#   Where the server stores jobs.db, outputs/, thumbs/, previews/, and
#   cache/inputs/. Backups = `tar` this directory.
#   Relative paths resolve against THIS file's directory, NOT your
#   shell's CWD — the binary behaves the same wherever you run it from.
#     "./data"                       next to the repo       (DEV)
#     "/var/lib/zun-rust-server"     FHS, system service    (PROD)
#
# log_format
#   How log lines are printed.
#     "auto"     pretty in a terminal, JSON when piped  (good default)
#     "pretty"   always colored text                    (DEV)
#     "json"     always JSON, plays well with journald  (PROD)
#
# Not in this file (and intentionally so):
#   - No environment variables. The TOML is the only source of truth.
#   - No XDG / implicit path discovery. You set `data_dir` explicitly.
#   - No workflow knobs. Workflows are baked into the binary.

# purge_after_days (default 30)
#   Days before soft-deleted jobs and unused input-cache files are
#   hard-purged. Matches the app's undo window — don't set it lower
#   than you want "undo delete" to work.
# purge_after_days = 30

# backup_keep_days (default 30)
#   Days of daily database snapshots to keep in <data_dir>/backups/.
# backup_keep_days = 30

# comfy_data_dir (default: unset)
#   ComfyUI's own data directory — the one containing input/ and output/.
#   Set it only when ComfyUI runs on this machine.
#
#   Why you probably want it: every job uploads its source image into
#   ComfyUI's input/ and leaves a second copy of the result in its
#   output/. ComfyUI prunes neither and offers no delete endpoint, so
#   without this setting `purge_after_days` bounds only this server's
#   copies while ComfyUI's grow forever. (Measured on a real box: 23 MB
#   under data/outputs next to 445 MB of the same images under
#   ComfyUI/output.)
#
#   The daily purge then deletes files from those two directories that
#   are both named `zun_*` (i.e. written by this server) and older than
#   purge_after_days. Nothing else there is ever touched.
# comfy_data_dir = "/home/you/Desktop/grand-omega/zun-flux-pipeline/ComfyUI"
